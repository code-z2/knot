name = "relay-proxy"
main = "src/index.ts"
compatibility_date = "2026-02-11"

[observability]
enabled = true
head_sampling_rate = 1.0

[[routes]]
pattern = "relay.knot.fi"
custom_domain = true

[[routes]]
pattern = "upload.knot.fi"
custom_domain = true

[vars]
INITIAL_CREDIT_NATIVE = "2"
FLOOR_TESTNET_NATIVE = "-10"
FLOOR_MAINNET_NATIVE = "-2"
PINATA_SIGN_EXPIRES_SECONDS = "120"
PINATA_MAX_FILE_SIZE_BYTES = "10485760"

[vars.PINATA_GROUP_CONFIG]
testnet = "a02b2cb2-a62a-4d72-bf0a-dd26914af5ff"
mainnet = "c1b3931e-edba-4ce7-b57e-55ca022e38ea"

[vars.SINGLETON_CONFIG.testnet]
address = "0xE8dB5e6226364deDD69E57c7A437ad1c8805c9f2"
accumulatorFactory = "0x6edfE18365C911CFC88e241c87b3a0D313aD7129"
version = "1.0.0"
releaseNotes = "Initial Version"

[vars.SINGLETON_CONFIG.mainnet]
address = "0xE8dB5e6226364deDD69E57c7A437ad1c8805c9f2"
accumulatorFactory = "0x6edfE18365C911CFC88e241c87b3a0D313aD7129"
version = "1.0.0"
releaseNotes = "Initial Version"


[[kv_namespaces]]
binding = "GAS_TANK_KV"
id = "9899238f13454a319ec6ea19a20e6f18"

[[kv_namespaces]]
binding = "FAUCET_FUNDING_KV"
id = "9899238f13454a319ec6ea19a20e6f18"

[[durable_objects.bindings]]
name = "FAUCET_TRACKER_DO"
class_name = "FaucetTracker"

[[durable_objects.bindings]]
name = "WEBHOOK_TRACKER"
class_name = "AccumulatorWebhookTracker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FaucetTracker"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AccumulatorWebhookTracker"]

[[secrets_store_secrets]]
binding = "SERVER_KEY_STORE"
store_id = "187dd64443cc47a79eba24431a9610da"
secret_name = "SERVER_KEY"

# ---------------------------------------------------------------------------
# Code Z2: Deferred Transaction Infrastructure
# ---------------------------------------------------------------------------

# Dedicated KV for deferred relay state (isolated from GAS_TANK_KV)
[[kv_namespaces]]
binding = "DEFERRED_RELAY_KV"
id = "cc14e01d99b24b85b114b3277172fbc0"

# Queue: Batched relay for deferred intents + webhook management
[[queues.producers]]
queue = "relay-batch-queue"
binding = "RELAY_BATCH_QUEUE"

[[queues.consumers]]
queue = "relay-batch-queue"
max_batch_size = 20
max_batch_timeout = 2

# Queue: Anomaly alerting (Sweeper → Slack/Discord/Email)
[[queues.producers]]
queue = "alerts-queue"
binding = "ALERTS_QUEUE"

[[queues.consumers]]
queue = "alerts-queue"
max_batch_size = 10
max_batch_timeout = 5

# Sweeper Cron: Scan DEFERRED_RELAY_KV for stuck intents every 5 minutes
[triggers]
crons = ["*/5 * * * *"]
